name: site_app
description: "SITE — AI-Assisted Remote Catheter Monitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # HTTP & API
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # UI utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
